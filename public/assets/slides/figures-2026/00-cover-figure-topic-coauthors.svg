  <text x="48" y="126" class="jp navy" font-size="27" font-weight="700">RA-SS｜自由記述の構造化</text>

  <text x="50" y="242" class="serif navy" font-size="91" font-weight="800">届いているのに、</text>
  <text x="50" y="357" class="serif navy" font-size="91" font-weight="800">活かされない声がある。</text>
  <text x="52" y="413" class="jp navy" font-size="31" font-weight="700">患者・家族の自由記述を、構造として読み解き、扱えるデータへ変える試み</text>
  <text x="52" y="470" class="jp navy" font-size="26" font-weight="600">本発表では、302件の自由記述をもとに、出来事の背後にある</text>
  <text x="52" y="508" class="jp navy" font-size="26" font-weight="600">関係のズレ・変化・欠損を読み取り、広報・IC支援・現場改善につなげる可能性を検討します。</text>

